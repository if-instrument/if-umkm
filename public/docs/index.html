<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>API Documentation - IF Instrument UMKM Solution</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
  <link rel="icon" type="image/jpeg" href="/assets/if-instrument-logo.jpg" />
  <style>
    body {
      margin: 0;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .custom-header {
      background: #3B1F8C;
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .custom-header .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .custom-header img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
    }
    .custom-header h1 {
      font-size: 1.1rem;
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .custom-header .links {
      display: flex;
      gap: 16px;
    }
    .custom-header a {
      color: #ede9fe;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      transition: all 0.2s;
    }
    .custom-header a:hover {
      background: rgba(255,255,255,0.25);
      color: white;
    }
    .swagger-ui .topbar { display: none !important; }
    .swagger-ui .info { margin: 24px 0 16px 0; }
  </style>
</head>
<body>
  <header class="custom-header">
    <div class="brand">
      <img src="/assets/if-instrument-logo.jpg" alt="Logo" onerror="this.style.display='none'">
      <div>
        <h1>IF Instrument UMKM Solution API Docs</h1>
        <small style="color: #c4b5fd;">REST API Specification & Testing Interactive Hub</small>
      </div>
    </div>
    <div class="links">
      <a href="http://127.0.0.1:8000/docs" target="_blank" rel="noopener">🧠 Python AI Swagger Docs</a>
      <a href="/" target="_blank" rel="noopener">🖥️ Buka Portal POS</a>
    </div>
  </header>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: '/docs/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        docExpansion: "list",
        filter: true,
        showExtensions: true,
        showCommonExtensions: true,
        tryItOutEnabled: true
      });
    };
  </script>
</body>
</html>
